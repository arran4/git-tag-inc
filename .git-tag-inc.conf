# Default git-tag-inc configuration
# You can customize your pre-release stages and environments here.

Envs=test,uat,staging,prod
Stages=alpha,beta,rc,next

Mode.semver=v{major}.{minor}.{patch}[-{stage}.{stage_val}][.{env}.{env_val}][.{release}]
Mode.legacy=v{major}.{minor}.{patch}[-{stage}{stage_val}][-{env}{env_val}][.{release}]
Mode.arraneous=v{major}.{minor}.{patch}[-{stage}{stage_val}][-{env}{env_val}][.{release}]
